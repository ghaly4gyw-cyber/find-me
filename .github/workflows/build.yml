name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME" >&2
            find "$ANDROID_HOME" -maxdepth 3 >&2 || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Generate version.json for in-app update checks
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "{\"versionCode\": $VERSION_CODE, \"versionName\": \"$VERSION_NAME\"}" > app/build/outputs/apk/debug/version.json
          cat app/build/outputs/apk/debug/version.json

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: find-me-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatic build from the latest push to main. The app can install this update on itself (Tools → Check for updates), or download app-debug.apk below and install it manually.
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/version.json
            control.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-backend:
    runs-on: ubuntu-latest
    # Waits for the build job so it can reuse the exact same APK it just
    # produced (via download-artifact below) for the public download page,
    # instead of building a second copy.
    needs: build
    steps:
      - uses: actions/checkout@v4

      # The public download page (backend/download/) serves this straight
      # off the host — the same APK the build job just published to GitHub
      # Releases, so patrons.digital always has what GitHub has.
      - name: Download the APK built by the build job
        uses: actions/download-artifact@v4
        with:
          name: find-me-debug-apk
          path: backend/download/

      - name: Write version.json and control.json for the download page
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "{\"versionCode\": $VERSION_CODE, \"versionName\": \"$VERSION_NAME\"}" > backend/download/version.json
          cp control.json backend/download/control.json
          ls -la backend/download/

      # db-config.php holds real credentials and is rendered here, in this
      # disposable runner, from the committed placeholder template — it is
      # never written to the repo and never appears in git history. The
      # runner (and this file with it) is destroyed when the job ends.
      - name: Render db-config.php from secrets
        run: |
          python3 - <<'PYEOF'
          import os

          # Escape for a single-quoted PHP string literal, so a value with a
          # backslash or a single quote in it (passwords can have either)
          # can't break out of the string or corrupt the file.
          def php_escape(value):
              return value.replace('\\', '\\\\').replace("'", "\\'")

          text = open('backend/db-config.template.php').read()
          text = text.replace('__DB_HOST__', php_escape(os.environ['DB_HOST']))
          text = text.replace('__DB_NAME__', php_escape(os.environ['DB_NAME']))
          text = text.replace('__DB_USER__', php_escape(os.environ['DB_USER']))
          text = text.replace('__DB_PASSWORD__', php_escape(os.environ['DB_PASSWORD']))
          open('backend/db-config.php', 'w').write(text)
          PYEOF
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      # Same pattern as db-config.php above, for the admin dashboard's single
      # shared password.
      - name: Render admin-config.php from secrets
        run: |
          python3 - <<'PYEOF'
          import os

          def php_escape(value):
              return value.replace('\\', '\\\\').replace("'", "\\'")

          text = open('backend/admin-config.template.php').read()
          text = text.replace('__ADMIN_PASSWORD__', php_escape(os.environ['ADMIN_PASSWORD']))
          open('backend/admin-config.php', 'w').write(text)
          PYEOF
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # Deploys ONLY the contents of backend/ into a dedicated findme-api/
      # subfolder on the server — never the FTP account's root, so nothing
      # else already on that hosting account is ever touched or overwritten.
      - name: FTP deploy backend/ to findme-api/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend/
          server-dir: ./findme-api/
          exclude: |
            **/*.template.php

      # Proves the endpoint is actually live and talking to the database —
      # my own sandbox can't reach this host directly, but this runner can.
      # A GET isn't a valid call (the endpoint only accepts POST), so a plain
      # 405 with this exact JSON is the expected, healthy result; anything
      # else (404, 500, a PHP error dump, no response) fails the job so a
      # broken deploy is never silently left live.
      - name: Verify the registration endpoint responds
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" https://patrons.digital/findme-api/register.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "405" ]; then
            echo "::error::Expected HTTP 405 (method not allowed) for a GET, got $response"
            exit 1
          fi
          if ! grep -q '"method_not_allowed"' /tmp/response.json; then
            echo "::error::Response body didn't match the expected error JSON"
            exit 1
          fi
          echo "Endpoint is reachable and the PHP itself runs."

      # Goes one step further than the GET check above: a real POST proves
      # the database credentials are correct and the table gets created —
      # not just that the file exists. Uses a fixed, obviously-fake
      # device_id/phone so every deploy just upserts the same one harmless
      # canary row forever instead of adding a new one each time.
      - name: Verify the database round-trip works
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Healthcheck","phone":"20000000","device_id":"ci-healthcheck-canary"}' \
            https://patrons.digital/findme-api/register.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/response.json; then
            echo "::error::Database round-trip failed — check DB_HOST/DB_NAME/DB_USER/DB_PASSWORD secrets"
            exit 1
          fi
          echo "Database round-trip confirmed working."

      # db-config.php holds the real database password once rendered —
      # confirms the .htaccess rule actually blocks it from being downloaded
      # directly, not just that it's present.
      - name: Verify db-config.php is NOT publicly downloadable
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" https://patrons.digital/findme-api/db-config.php)
          echo "HTTP status for db-config.php: $status"
          if [ "$status" == "200" ]; then
            echo "::error::db-config.php is PUBLICLY DOWNLOADABLE — the .htaccess rule isn't being applied"
            exit 1
          fi
          echo "db-config.php is not publicly accessible — good."

      - name: Verify admin-config.php is NOT publicly downloadable
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" https://patrons.digital/findme-api/admin-config.php)
          echo "HTTP status for admin-config.php: $status"
          if [ "$status" == "200" ]; then
            echo "::error::admin-config.php is PUBLICLY DOWNLOADABLE — the .htaccess rule isn't being applied"
            exit 1
          fi
          echo "admin-config.php is not publicly accessible — good."

      # Same canary-row approach as the registration check above, now for
      # location-update.php — proves the UPDATE actually reaches a real row.
      # Also sends the device/network-info fields so that round-trip (new
      # this release) is exercised too, not just lat/lng.
      - name: Verify the location-update endpoint works
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"device_id":"ci-healthcheck-canary","lat":20.0,"lng":-10.0,"device_model":"CI Runner","android_version":"Android 14","app_version":"ci-test","network_type":"wifi","network_name":"ci-net"}' \
            https://patrons.digital/findme-api/location-update.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/response.json; then
            echo "::error::Location update failed"
            exit 1
          fi
          echo "Location update endpoint confirmed working."

      # Same canary-row approach again, now for usage-update.php — an
      # upsert against the same fixed canary device, so re-running this on
      # every deploy never grows the table.
      - name: Verify the usage-update endpoint works
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"device_id":"ci-healthcheck-canary","app_opens":1,"total_ms":60000,"features":{"CalculatorFragment":{"opens":1,"ms":60000}}}' \
            https://patrons.digital/findme-api/usage-update.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/response.json; then
            echo "::error::Usage update failed"
            exit 1
          fi
          echo "Usage update endpoint confirmed working."

      # Same canary-row approach again, now for public-place-upload.php — an
      # upsert keyed on place_id, so re-running this on every deploy never
      # grows the table, it just refreshes the same one canary place.
      - name: Verify the public-place-upload endpoint works
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"device_id":"ci-healthcheck-canary","places":[{"place_id":"ci-healthcheck-place","name":"CI Canary Water Point","lat":20.0,"lon":-10.0,"shared_by_name":"CI Healthcheck","ts":1700000000000}]}' \
            https://patrons.digital/findme-api/public-place-upload.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/response.json; then
            echo "::error::Public place upload failed"
            exit 1
          fi
          echo "Public-place-upload endpoint confirmed working."

      # feedback.php is append-only (every real submission is kept forever),
      # so this deliberately does NOT post a real message every deploy —
      # that would grow the table forever. Instead it sends a request
      # missing the required message field and expects the endpoint's own
      # validation to reject it with 400, which proves it's live and wired
      # to the database without ever inserting a row.
      - name: Verify the feedback endpoint responds
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"device_id":"ci-healthcheck-canary"}' \
            https://patrons.digital/findme-api/feedback.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "400" ] || ! grep -q '"missing_or_invalid_fields"' /tmp/response.json; then
            echo "::error::Feedback endpoint didn't validate as expected"
            exit 1
          fi
          echo "Feedback endpoint confirmed working."

      # control.php is what RemoteControl.kt now reads instead of GitHub's
      # control.json — a plain GET, no auth, same as the old public file.
      # Confirms it responds with the shape the app expects (defaults to
      # min_supported_version 0 / no message on a fresh row).
      - name: Verify the control endpoint responds
        run: |
          response=$(curl -sS -o /tmp/response.json -w "%{http_code}" https://patrons.digital/findme-api/control.php)
          echo "HTTP status: $response"
          cat /tmp/response.json
          echo
          if [ "$response" != "200" ] || ! grep -q '"min_supported_version"' /tmp/response.json; then
            echo "::error::Control endpoint didn't respond as expected"
            exit 1
          fi
          if ! grep -q '"kill_switch"' /tmp/response.json; then
            echo "::error::Control endpoint is missing the kill_switch field"
            exit 1
          fi
          echo "Control endpoint confirmed working."

      # Full login round-trip: posts Ghaly's real username+password (his
      # account self-seeds into admin_accounts, from the same ADMIN_PASSWORD
      # secret as before, the very first time anyone logs in against a
      # fresh database), follows the redirect, and confirms the resulting
      # page is actually the logged-in dashboard (not another login form),
      # lists the canary user, and renders the usage-analytics sections
      # added alongside it — proves the session/auth/DB-query chain end to
      # end, not just that the page loads.
      - name: Verify the admin dashboard login works
        run: |
          rm -f /tmp/cookies.txt
          curl -sS -c /tmp/cookies.txt -o /dev/null \
            -X POST --data-urlencode "username=ghaly" --data-urlencode "password=${ADMIN_PASSWORD}" \
            https://patrons.digital/findme-api/admin/login.php
          status=$(curl -sS -b /tmp/cookies.txt -o /tmp/admin_page.html -w "%{http_code}" \
            https://patrons.digital/findme-api/admin/index.php)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Admin dashboard didn't return 200 after logging in"
            exit 1
          fi
          if grep -qi "wrong password\|<form method=\"post\">" /tmp/admin_page.html; then
            echo "::error::Still looking at the login form — login didn't actually work"
            exit 1
          fi
          if ! grep -q "CI Healthcheck" /tmp/admin_page.html; then
            echo "::error::Dashboard page didn't contain the expected user content"
            exit 1
          fi
          if ! grep -q "Most used features" /tmp/admin_page.html; then
            echo "::error::Dashboard page is missing the usage-analytics section"
            exit 1
          fi
          if ! grep -q "Suggestions from users" /tmp/admin_page.html; then
            echo "::error::Dashboard page is missing the feedback section"
            exit 1
          fi
          if ! grep -q "App control" /tmp/admin_page.html; then
            echo "::error::Dashboard page is missing the App control section"
            exit 1
          fi
          if ! grep -q "Public places" /tmp/admin_page.html; then
            echo "::error::Dashboard page is missing the Public places section"
            exit 1
          fi
          if ! grep -q "CI Canary Water Point" /tmp/admin_page.html; then
            echo "::error::Public place from public-place-upload.php isn't showing up on the admin dashboard"
            exit 1
          fi
          if ! grep -q "CI Runner" /tmp/admin_page.html; then
            echo "::error::Device/network info from location-update.php isn't showing up on the admin dashboard"
            exit 1
          fi
          echo "Admin login + dashboard confirmed working."
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      # Full round-trip for the block/unblock feature: blocks the canary
      # device using the authenticated session from the step above, confirms
      # status-check.php reports it blocked, then unblocks it again and
      # confirms that too — so the canary is always left unblocked for every
      # other check that relies on it, on this run and the next.
      - name: Verify block/unblock and the status-check endpoint
        run: |
          curl -sS -b /tmp/cookies.txt -o /dev/null \
            -X POST --data-urlencode "device_id=ci-healthcheck-canary" --data-urlencode "action=block" \
            https://patrons.digital/findme-api/admin/block-user.php
          response=$(curl -sS "https://patrons.digital/findme-api/status-check.php?device_id=ci-healthcheck-canary")
          echo "After block: $response"
          if ! echo "$response" | grep -q '"blocked":true'; then
            echo "::error::Blocking the canary device didn't take effect"
            exit 1
          fi
          curl -sS -b /tmp/cookies.txt -o /dev/null \
            -X POST --data-urlencode "device_id=ci-healthcheck-canary" --data-urlencode "action=unblock" \
            https://patrons.digital/findme-api/admin/block-user.php
          response=$(curl -sS "https://patrons.digital/findme-api/status-check.php?device_id=ci-healthcheck-canary")
          echo "After unblock: $response"
          if ! echo "$response" | grep -q '"blocked":false'; then
            echo "::error::Unblocking the canary device didn't take effect"
            exit 1
          fi
          echo "Block/unblock and status-check confirmed working."

      # The public download page needs no login — proves the page itself
      # renders AND that the real APK file landed on the host and isn't
      # empty/truncated (a broken upload would otherwise look "successful"
      # while leaving a 0-byte or missing file for real users to hit).
      # Exercises the PIN/reclaim account-security feature end to end, using
      # a second fixed canary pair (kept entirely separate from
      # ci-healthcheck-canary above, since reclaiming reassigns device_id and
      # would otherwise disrupt every other check that relies on that one
      # staying put). Ends by reclaiming back to the original device, so
      # re-running this on the next deploy starts from the same state again
      # — same idempotent-canary pattern as the block/unblock check.
      - name: Verify PIN set, wrong-PIN rejection, reclaim, and backup upload
        run: |
          set -e
          PHONE="30000000"
          DEV_A="ci-healthcheck-canary-pin"
          DEV_B="ci-healthcheck-canary-pin-b"

          echo "--- register device A ---"
          curl -sS -o /dev/null -w "status: %{http_code}\n" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"name\":\"CI PIN Canary\",\"phone\":\"$PHONE\",\"device_id\":\"$DEV_A\"}" \
            https://patrons.digital/findme-api/register.php

          echo "--- device A sets its PIN ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV_A\",\"pin\":\"123456\"}" \
            https://patrons.digital/findme-api/set-pin.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/r.json; then
            echo "::error::set-pin.php failed"; exit 1
          fi

          echo "--- wrong PIN is rejected ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"pin\":\"000000\",\"device_id\":\"$DEV_B\"}" \
            https://patrons.digital/findme-api/reclaim.php)
          cat /tmp/r.json; echo
          if [ "$response" != "401" ] || ! grep -q '"wrong_pin"' /tmp/r.json; then
            echo "::error::reclaim.php accepted a wrong PIN"; exit 1
          fi

          echo "--- correct PIN reclaims the number onto device B ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"pin\":\"123456\",\"device_id\":\"$DEV_B\"}" \
            https://patrons.digital/findme-api/reclaim.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"CI PIN Canary"' /tmp/r.json; then
            echo "::error::reclaim.php didn't succeed with the correct PIN"; exit 1
          fi

          echo "--- device A now reads as signed out, device B as registered ---"
          response=$(curl -sS "https://patrons.digital/findme-api/status-check.php?device_id=$DEV_A")
          echo "$response"
          if ! echo "$response" | grep -q '"still_registered":false'; then
            echo "::error::old device still reads as registered after reclaim"; exit 1
          fi
          response=$(curl -sS "https://patrons.digital/findme-api/status-check.php?device_id=$DEV_B")
          echo "$response"
          if ! echo "$response" | grep -q '"still_registered":true'; then
            echo "::error::new device doesn't read as registered after reclaim"; exit 1
          fi

          echo "--- a device that doesn't own the number can't upload its backup ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV_A\",\"backup_json\":\"{}\"}" \
            https://patrons.digital/findme-api/backup-upload.php)
          cat /tmp/r.json; echo
          if [ "$response" != "403" ]; then
            echo "::error::backup-upload.php let a non-owner device upload"; exit 1
          fi

          echo "--- the current owner (device B) can upload its backup ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV_B\",\"backup_json\":\"{\\\"notes\\\":[]}\"}" \
            https://patrons.digital/findme-api/backup-upload.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/r.json; then
            echo "::error::backup-upload.php failed for the current owner"; exit 1
          fi

          echo "--- reclaim back to device A, so the next run starts from the same state ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"pin\":\"123456\",\"device_id\":\"$DEV_A\"}" \
            https://patrons.digital/findme-api/reclaim.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ]; then
            echo "::error::couldn't reclaim back to device A for idempotency"; exit 1
          fi
          echo "PIN/reclaim/backup round-trip confirmed working."

      # Exercises the online contacts/messaging feature end to end — "when
      # they are online, they can do more stuff": text messages and an
      # online/offline dot, reached by adding someone's contact code. Uses a
      # third fixed canary pair (kept entirely separate from the ones above,
      # since this touches its own contacts/messages tables and heartbeats).
      # Note: unlike the other canary checks, send-message.php has no upsert
      # to reuse, so this does leave one small new row in `messages` per CI
      # run — acceptable, since each row is just a short text string.
      - name: Verify online contacts, heartbeat, and messaging
        run: |
          set -e
          PHONE_A="40000001"
          PHONE_B="40000002"
          DEV_A="ci-healthcheck-canary-online-a"
          DEV_B="ci-healthcheck-canary-online-b"

          echo "--- register both canary devices and capture their contact codes ---"
          response=$(curl -sS -o /tmp/ra.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"name\":\"CI Online Canary A\",\"phone\":\"$PHONE_A\",\"device_id\":\"$DEV_A\"}" \
            https://patrons.digital/findme-api/register.php)
          cat /tmp/ra.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/ra.json; then
            echo "::error::register.php failed for canary A"; exit 1
          fi
          CODE_A=$(grep -oP '"contact_code":"\K[^"]+' /tmp/ra.json)
          if [ -z "$CODE_A" ]; then
            echo "::error::register.php didn't return a contact_code for canary A"; exit 1
          fi

          response=$(curl -sS -o /tmp/rb.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"name\":\"CI Online Canary B\",\"phone\":\"$PHONE_B\",\"device_id\":\"$DEV_B\"}" \
            https://patrons.digital/findme-api/register.php)
          cat /tmp/rb.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/rb.json; then
            echo "::error::register.php failed for canary B"; exit 1
          fi

          echo "--- canary A sends a heartbeat ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_A\",\"device_id\":\"$DEV_A\"}" \
            https://patrons.digital/findme-api/heartbeat.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/r.json; then
            echo "::error::heartbeat.php failed"; exit 1
          fi

          echo "--- canary B adds canary A by contact code ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_B\",\"device_id\":\"$DEV_B\",\"contact_code\":\"$CODE_A\"}" \
            https://patrons.digital/findme-api/add-contact.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q "\"phone\":\"$PHONE_A\"" /tmp/r.json; then
            echo "::error::add-contact.php failed"; exit 1
          fi

          echo "--- an unknown contact code is rejected ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_B\",\"device_id\":\"$DEV_B\",\"contact_code\":\"ZZZZZZ\"}" \
            https://patrons.digital/findme-api/add-contact.php)
          cat /tmp/r.json; echo
          if [ "$response" != "404" ] || ! grep -q '"contact_code_not_found"' /tmp/r.json; then
            echo "::error::add-contact.php didn't reject an unknown code"; exit 1
          fi

          echo "--- canary B sees canary A as online ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_B\",\"device_id\":\"$DEV_B\",\"phones\":[\"$PHONE_A\"]}" \
            https://patrons.digital/findme-api/contacts-status.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"online":true' /tmp/r.json; then
            echo "::error::contacts-status.php didn't report canary A as online"; exit 1
          fi

          echo "--- canary A sends canary B a message ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_A\",\"device_id\":\"$DEV_A\",\"to_phone\":\"$PHONE_B\",\"body\":\"CI canary ping\"}" \
            https://patrons.digital/findme-api/send-message.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/r.json; then
            echo "::error::send-message.php failed"; exit 1
          fi

          echo "--- canary B fetches it ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_B\",\"device_id\":\"$DEV_B\",\"since_id\":0}" \
            https://patrons.digital/findme-api/fetch-messages.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q 'CI canary ping' /tmp/r.json; then
            echo "::error::fetch-messages.php didn't return the message to canary B"; exit 1
          fi

          echo "--- a non-owner device is rejected ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE_A\",\"device_id\":\"some-other-device\"}" \
            https://patrons.digital/findme-api/heartbeat.php)
          cat /tmp/r.json; echo
          if [ "$response" != "403" ]; then
            echo "::error::heartbeat.php let a non-owner device act as canary A"; exit 1
          fi

          echo "Online contacts/heartbeat/messaging round-trip confirmed working."

      # Exercises the account-activation gate — "the app cannot be activated
      # without that password or accepting the demand". Deliberately does
      # NOT attempt to impersonate Ghaly's or Osama's real admin phones (no
      # fake CI-only admin number is added to ADMIN_PHONES either — that
      # would permanently grant real admin power to whoever ever registers
      # that number for real, in production, not just in CI). Instead this
      # proves: a brand-new account starts locked, the request/confirm
      # endpoints work for an ordinary (non-admin) account, and the two
      # admin-only endpoints correctly reject a non-admin with 403 — the
      # actual approve/reject path is covered by manual testing with Ghaly's
      # and Osama's own phones instead.
      - name: Verify the activation gate starts locked and enforces admin-only access
        run: |
          set -e
          # A fresh phone/device every run (derived from the run id, not a
          # fixed canary) — unlike the other canaries, this one's whole point
          # is proving a BRAND NEW account starts locked, and re-running
          # against the same phone on a later deploy would find it already
          # activated by this same test's own activation-confirm.php call
          # below (there's no "deactivate" endpoint to undo that with, since
          # the real product never needs one). Accumulating one extra always-
          # activated test row per deploy is a fine trade for that — same
          # accepted trade-off as the online-messaging canary's `messages`
          # table growth.
          PHONE="4${GITHUB_RUN_ID: -7}"
          DEV="ci-healthcheck-canary-activation-$GITHUB_RUN_ID"

          echo "--- a brand-new registration starts locked ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"name\":\"CI Activation Canary\",\"phone\":\"$PHONE\",\"device_id\":\"$DEV\"}" \
            https://patrons.digital/findme-api/register.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"activated":false' /tmp/r.json || ! grep -q '"is_admin":false' /tmp/r.json; then
            echo "::error::register.php didn't start this new account locked"; exit 1
          fi

          echo "--- status-check.php agrees it's not activated ---"
          response=$(curl -sS "https://patrons.digital/findme-api/status-check.php?device_id=$DEV")
          echo "$response"
          if ! echo "$response" | grep -q '"activated":false'; then
            echo "::error::status-check.php reported the new account as already activated"; exit 1
          fi

          echo "--- it can submit an activation request ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV\"}" \
            https://patrons.digital/findme-api/activate-request.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/r.json; then
            echo "::error::activate-request.php failed for an ordinary account"; exit 1
          fi

          echo "--- but it cannot list or decide pending requests itself (not an admin) ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV\"}" \
            https://patrons.digital/findme-api/activation-requests-list.php)
          cat /tmp/r.json; echo
          if [ "$response" != "403" ] || ! grep -q '"not_an_admin"' /tmp/r.json; then
            echo "::error::activation-requests-list.php let a non-admin account in"; exit 1
          fi
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV\",\"request_id\":1,\"decision\":\"approve\"}" \
            https://patrons.digital/findme-api/activation-decide.php)
          cat /tmp/r.json; echo
          if [ "$response" != "403" ] || ! grep -q '"not_an_admin"' /tmp/r.json; then
            echo "::error::activation-decide.php let a non-admin account decide a request"; exit 1
          fi

          echo "--- a local code activation's opportunistic server sync works ---"
          response=$(curl -sS -o /tmp/r.json -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" \
            -d "{\"phone\":\"$PHONE\",\"device_id\":\"$DEV\"}" \
            https://patrons.digital/findme-api/activation-confirm.php)
          cat /tmp/r.json; echo
          if [ "$response" != "200" ] || ! grep -q '"status":"ok"' /tmp/r.json; then
            echo "::error::activation-confirm.php failed"; exit 1
          fi
          response=$(curl -sS "https://patrons.digital/findme-api/status-check.php?device_id=$DEV")
          echo "$response"
          if ! echo "$response" | grep -q '"activated":true'; then
            echo "::error::status-check.php still shows the account as locked after activation-confirm.php"; exit 1
          fi

          echo "Activation gate round-trip confirmed working."

      # Ghaly's standing instruction: every release from here on forces
      # every older install to update — "force all the clients and people to
      # update... If they does not update, then they does not get anything."
      # Reuses the already-authenticated session from the admin-login step
      # above to raise min_supported_version to match the build this very
      # run just shipped, through the exact same form the dashboard's "App
      # control" panel submits to (control-save.php) — so this is a bona
      # fide admin action, not a bypass of it, and Ghaly can always override
      # it by hand from the dashboard afterward if he ever wants to pause it.
      # Everything else in that row (the one-time message fields, and
      # min_supported_message — left blank so the app falls back to its own
      # localized, data-safety-reassuring default text) is read back first
      # and POSTed unchanged, so this never clobbers a message Ghaly set
      # from the dashboard himself.
      - name: Force every older install to update to this release
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "Raising min_supported_version to $VERSION_CODE"
          current=$(curl -sS https://patrons.digital/findme-api/control.php)
          echo "Current control state: $current"
          # shlex.quote() is essential here — this file gets `source`d as a
          # shell script next, and a real one-time message can contain
          # spaces, quotes, or (as happened once in production, with an
          # Arabic message) just plain words that bash would otherwise try
          # to execute as commands rather than treat as plain text.
          python3 - "$current" <<'PYEOF' > /tmp/current_message.env
          import json, sys, shlex
          data = json.loads(sys.argv[1])
          msg = data.get("message") or {}
          print(f"MSG_TITLE={shlex.quote(msg.get('title', ''))}")
          print(f"MSG_BODY={shlex.quote(msg.get('body', ''))}")
          print(f"MIN_MSG={shlex.quote(data.get('min_supported_message') or '')}")
          PYEOF
          source /tmp/current_message.env
          curl -sS -b /tmp/cookies.txt -o /tmp/control_save.html -w "\nHTTP status: %{http_code}\n" \
            -X POST \
            --data-urlencode "message_title=${MSG_TITLE}" \
            --data-urlencode "message_body=${MSG_BODY}" \
            --data-urlencode "min_supported_version=${VERSION_CODE}" \
            --data-urlencode "min_supported_message=${MIN_MSG}" \
            https://patrons.digital/findme-api/admin/control-save.php
          updated=$(curl -sS https://patrons.digital/findme-api/control.php)
          echo "Control state after save: $updated"
          if ! echo "$updated" | grep -q "\"min_supported_version\":${VERSION_CODE}"; then
            echo "::error::min_supported_version didn't actually update to $VERSION_CODE"
            exit 1
          fi
          echo "Every install below versionCode $VERSION_CODE will now be gated until it updates."

      - name: Verify the public download page and APK are live
        run: |
          status=$(curl -sS -o /tmp/download_page.html -w "%{http_code}" https://patrons.digital/findme-api/download/)
          echo "HTTP status for download page: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Download page didn't return 200"
            exit 1
          fi
          if grep -q "التطبيق غير متوفر للتحميل حاليًا" /tmp/download_page.html; then
            echo "::error::Download page is live but reports the APK as missing"
            exit 1
          fi
          apk_status=$(curl -sS -o /dev/null -w "%{http_code}" https://patrons.digital/findme-api/download/app-debug.apk)
          apk_size=$(curl -sSI https://patrons.digital/findme-api/download/app-debug.apk | grep -i '^content-length' | tr -d '\r' | cut -d' ' -f2)
          echo "APK status: $apk_status, size: ${apk_size:-unknown} bytes"
          if [ "$apk_status" != "200" ] || [ -z "$apk_size" ] || [ "$apk_size" -lt 1000000 ]; then
            echo "::error::APK on the host is missing or suspiciously small"
            exit 1
          fi
          echo "Public download page and APK confirmed live on the host."
